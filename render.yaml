services:
  - type: web
    name: pella-b2-recorder
    env: node
    buildCommand: npm install && PLAYWRIGHT_BROWSERS_PATH=0 npx playwright install chromium
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: VIDEO_WIDTH
        value: 854
      - key: VIDEO_HEIGHT
        value: 480
      - key: RECORD_SECONDS
        value: 30
      - key: PAGE_TIMEOUT_MS
        value: 60000
      - key: PAGE_WARMUP_MS
        value: 3000
      - key: URLS_FILE
        value: ./urls.txt
      - key: RECORDINGS_DIR
        value: ./recordings
      - key: AUTO_START
        value: false
      - key: DELETE_LOCAL_AFTER_UPLOAD
        value: false
